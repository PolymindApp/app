name: Release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        default: all
        type: choice
        options:
          - all
          - web
          - android
          - ios
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  deploy_web:
    name: Deploy web application
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'web'
    runs-on: ubuntu-24.04
    environment: Web
    timeout-minutes: 20
    concurrency:
      group: production-ftp-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build project
        run: pnpm build:prod
        env:
          VITE_API_URL: /server

      - name: Normalize FTP path
        id: ftp_path
        env:
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          if [[ -z "$FTP_PATH" ]]; then
            echo "FTP_PATH is not configured." >&2
            exit 1
          fi

          ftp_root="${FTP_PATH%/}/"
          echo "root=$ftp_root" >> "$GITHUB_OUTPUT"
          echo "server=${ftp_root}server/" >> "$GITHUB_OUTPUT"
          echo "vendor=${ftp_root}vendor/" >> "$GITHUB_OUTPUT"

      - name: Deploy PHP dependencies
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./vendor/
          server-dir: ${{ steps.ftp_path.outputs.vendor }}
          state-name: .ftp-deploy-vendor-sync-state.json

      - name: Deploy PHP server
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./server/
          server-dir: ${{ steps.ftp_path.outputs.server }}
          state-name: .ftp-deploy-server-sync-state.json
          exclude: |
            config.local.php
            **/*.db
            **/*.db-*

      - name: Deploy web application
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.ftp_path.outputs.root }}
          state-name: .ftp-deploy-web-sync-state.json
          exclude: |
            server/**
            private/**
            vendor/**
            .env
            .env.*

  migrate_server:
    name: Run database migrations
    needs: deploy_web
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'web'
    runs-on: ubuntu-24.04
    environment: Web
    timeout-minutes: 5
    concurrency:
      group: production-ftp-deploy
      cancel-in-progress: false

    steps:
      - name: Run server migrations
        env:
          MIGRATION_URL: ${{ vars.MIGRATION_URL || 'https://mom.coulombe.dev/server/migrate.php' }}
          POLYMIND_MIGRATION_KEY: ${{ secrets.POLYMIND_MIGRATION_KEY }}
        run: |
          if [[ "$MIGRATION_URL" != https://* ]]; then
            echo "MIGRATION_URL must use HTTPS." >&2
            exit 1
          fi
          if (( ${#POLYMIND_MIGRATION_KEY} < 32 )); then
            echo "POLYMIND_MIGRATION_KEY must contain at least 32 characters." >&2
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f -- "$response_file"' EXIT
          http_status="$(
            curl \
              --silent \
              --show-error \
              --retry 4 \
              --retry-delay 2 \
              --retry-all-errors \
              --proto '=https' \
              --request GET \
              --header "Accept: application/json" \
              --header "X-Polymind-Migration-Key: $POLYMIND_MIGRATION_KEY" \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$MIGRATION_URL"
          )"

          cat "$response_file"
          echo
          if [[ "$http_status" != "200" ]]; then
            echo "Migration request failed with HTTP $http_status." >&2
            exit 1
          fi

  build_android:
    name: Build signed Android APK
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'android'
    runs-on: ubuntu-24.04
    environment: Android
    timeout-minutes: 30
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android SDK 36
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            echo "Android SDK platform 36 is missing from the runner." >&2
            exit 1
          fi
          if [[ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            echo "Android SDK build-tools 36.0.0 are missing from the runner." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production environment
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mom.coulombe.dev/server' }}
        run: printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.prod

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
          EXPECTED_ANDROID_KEYSTORE_SHA256: ${{ vars.ANDROID_KEYSTORE_SHA256 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_PROPERTIES_BASE64" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi

          mkdir -p private
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > private/polymind-release.jks
          printf '%s' "$ANDROID_SIGNING_PROPERTIES_BASE64" \
            | base64 --decode > private/android-signing.properties
          chmod 600 private/polymind-release.jks private/android-signing.properties

          keystore_sha256="$(
            sha256sum private/polymind-release.jks \
              | cut -d ' ' -f 1
          )"
          echo "Decoded keystore SHA-256: $keystore_sha256"
          if [[
            -n "$EXPECTED_ANDROID_KEYSTORE_SHA256"
            && "$keystore_sha256" != "$EXPECTED_ANDROID_KEYSTORE_SHA256"
          ]]; then
            echo "The decoded keystore does not match ANDROID_KEYSTORE_SHA256." >&2
            exit 1
          fi

          signing_store_file="$(
            sed -n 's/^storeFile=//p' private/android-signing.properties \
              | tr -d '\r'
          )"
          signing_store_password="$(
            sed -n 's/^storePassword=//p' private/android-signing.properties \
              | tr -d '\r'
          )"
          signing_key_alias="$(
            sed -n 's/^keyAlias=//p' private/android-signing.properties \
              | tr -d '\r'
          )"
          if [[
            "$signing_store_file" != "polymind-release.jks"
            || -z "$signing_store_password"
            || -z "$signing_key_alias"
          ]]; then
            echo "The decoded Android signing properties are invalid." >&2
            exit 1
          fi
          if ! keytool -list \
            -keystore private/polymind-release.jks \
            -storepass "$signing_store_password" \
            -alias "$signing_key_alias" >/dev/null 2>&1; then
            echo "The decoded keystore is invalid or does not match the signing properties." >&2
            exit 1
          fi

      - name: Build signed release APK
        run: pnpm android:build:release

      - name: Verify APK signature
        run: |
          apksigner_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$apksigner_path" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi

          "$apksigner_path" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Create checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Android release
        uses: actions/upload-artifact@v7
        with:
          name: polymind-android-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f private/polymind-release.jks private/android-signing.properties

  build_ios:
    name: Build signed iOS IPA
    # Temporarily disabled. To re-enable, restore:
    # if: github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'ios'
    if: ${{ false }}
    runs-on: macos-26
    environment: iOS
    timeout-minutes: 45
    concurrency:
      group: ios-release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcode_major="$(xcodebuild -version | sed -n '1s/^Xcode //p' | cut -d . -f 1)"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || ((xcode_major < 26)); then
            echo "Capacitor 8 requires Xcode 26 or newer." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production environment
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mom.coulombe.dev/server' }}
        run: printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.prod

      - name: Restore iOS signing files
        id: ios_signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[
            -z "$IOS_CERTIFICATE_BASE64"
            || -z "$IOS_CERTIFICATE_PASSWORD"
            || -z "$IOS_PROVISIONING_PROFILE_BASE64"
          ]]; then
            echo "iOS signing secrets are not configured." >&2
            exit 1
          fi

          certificate_path="$RUNNER_TEMP/polymind-distribution.p12"
          profile_source_path="$RUNNER_TEMP/polymind.mobileprovision"
          profile_plist_path="$RUNNER_TEMP/polymind-profile.plist"
          keychain_path="$RUNNER_TEMP/polymind-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"

          printf '%s' "$IOS_CERTIFICATE_BASE64" \
            | base64 -D > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" \
            | base64 -D > "$profile_source_path"
          chmod 600 "$certificate_path" "$profile_source_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          signing_certificate="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | sed -nE 's/.* ([[:xdigit:]]{40}) ".*$/\1/p' \
              | head -n 1
          )"
          [[ -n "$signing_certificate" ]] || {
            echo "No code-signing identity was found in the certificate." >&2
            exit 1
          }

          security cms -D -i "$profile_source_path" > "$profile_plist_path"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$profile_plist_path")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$profile_plist_path")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist_path")"
          application_identifier_prefix="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :ApplicationIdentifierPrefix:0' \
              "$profile_plist_path"
          )"
          application_identifier="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :Entitlements:application-identifier' \
              "$profile_plist_path"
          )"

          if [[ "$application_identifier" != "$application_identifier_prefix.app.polymind.ios" ]]; then
            echo "The provisioning profile does not target app.polymind.ios." >&2
            exit 1
          fi

          installed_profile="$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          mkdir -p "$(dirname "$installed_profile")"
          cp "$profile_source_path" "$installed_profile"

          echo "Using provisioning profile: $profile_name ($profile_uuid)"
          echo "Using Apple team: $team_id"
          echo "team_id=$team_id" >> "$GITHUB_OUTPUT"
          echo "signing_certificate=$signing_certificate" >> "$GITHUB_OUTPUT"
          echo "provisioning_profile=$profile_uuid" >> "$GITHUB_OUTPUT"
          echo "installed_profile=$installed_profile" >> "$GITHUB_OUTPUT"

      - name: Build signed release IPA
        env:
          IOS_TEAM_ID: ${{ steps.ios_signing.outputs.team_id }}
          IOS_SIGNING_CERTIFICATE: ${{ steps.ios_signing.outputs.signing_certificate }}
          IOS_PROVISIONING_PROFILE: ${{ steps.ios_signing.outputs.provisioning_profile }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
        run: pnpm ios:build:release

      - name: Create checksum
        run: |
          ipa_path="$(find ios/App/output -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [[ -z "$ipa_path" ]]; then
            echo "The iOS IPA was not created." >&2
            exit 1
          fi
          shasum -a 256 "$ipa_path" > "$ipa_path.sha256"

      - name: Upload iOS release
        uses: actions/upload-artifact@v7
        with:
          name: polymind-ios-release-${{ github.run_number }}
          path: |
            ios/App/output/*.ipa
            ios/App/output/*.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove iOS signing files
        if: always()
        env:
          INSTALLED_PROFILE: ${{ steps.ios_signing.outputs.installed_profile }}
        run: |
          security delete-keychain "$RUNNER_TEMP/polymind-signing.keychain-db" >/dev/null 2>&1 || true
          if [[ -n "$INSTALLED_PROFILE" ]]; then
            rm -f -- "$INSTALLED_PROFILE"
          fi
          rm -f -- \
            "$RUNNER_TEMP/polymind-distribution.p12" \
            "$RUNNER_TEMP/polymind.mobileprovision" \
            "$RUNNER_TEMP/polymind-profile.plist"
