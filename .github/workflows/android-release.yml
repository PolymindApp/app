name: Android release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    environment: Android
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/**/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify Android SDK 36
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-36" ]]; then
            echo "Android SDK platform 36 is missing from the runner." >&2
            exit 1
          fi
          if [[ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            echo "Android SDK build-tools 36.0.0 are missing from the runner." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare production environment
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://mom.coulombe.dev/server' }}
        run: printf 'VITE_API_URL=%s\n' "$VITE_API_URL" > .env.prod

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_SIGNING_PROPERTIES_BASE64" ]]; then
            echo "Android signing secrets are not configured." >&2
            exit 1
          fi

          mkdir -p private
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > private/mom-release.jks
          printf '%s' "$ANDROID_SIGNING_PROPERTIES_BASE64" \
            | base64 --decode > private/android-signing.properties
          chmod 600 private/mom-release.jks private/android-signing.properties

      - name: Build signed release APK
        run: pnpm android:build:release

      - name: Verify APK signature
        run: |
          apksigner_path="$(
            find "$ANDROID_HOME/build-tools" -type f -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$apksigner_path" ]]; then
            echo "Android apksigner was not found." >&2
            exit 1
          fi

          "$apksigner_path" verify \
            --verbose \
            android/app/build/outputs/apk/release/app-release.apk

      - name: Create checksum
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Android release
        uses: actions/upload-artifact@v7
        with:
          name: mom-android-release-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f private/mom-release.jks private/android-signing.properties
